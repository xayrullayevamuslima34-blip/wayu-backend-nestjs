# Render Blueprint: https://render.com/docs/blueprint-spec
# The database lives on Neon (free Postgres); paste its connection string into DB_URL.
services:
  - type: web
    name: wayu-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:prod && npm run seed:superadmin && npm run start:prod
    healthCheckPath: /public/tags/list
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BASE_URL
        sync: false
      - key: SUPERADMIN_LOGIN
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
